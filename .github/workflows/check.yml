name: Platform checks and Windows portable build
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m hwmonitor --help
      - run: python -m hwmonitor --check
      - run: python -m unittest discover -s tests/unit -t . -v
      - run: python tests/smoke_headless.py
      - run: python tests/smoke_launcher.py
      - run: bash -n start-linux.sh && sh -n start.sh
      - run: sh -n scripts/install-linux.sh && sh -n scripts/uninstall-linux.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python -m pip install 'cryptography>=44,<50'
      - run: python -m unittest discover -s tests -t . -v
      - run: python tests/ui/smoke_ui.py
      - run: python tests/ui/smoke_web.py
      - run: ./scripts/build.ps1
        shell: pwsh
      - name: Verify frozen application
        shell: pwsh
        run: |
          $process = Start-Process ./dist/HardwareMonitorUI/HardwareMonitorUI.exe -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'EXE self-test timed out' }
          if ($process.ExitCode -ne 0) { throw 'EXE failed' }
          $result = Get-Content dist/HardwareMonitorUI/.build/self-test/self-test.json | ConvertFrom-Json
          if ($result.errors.Count -or -not $result.icon_available -or -not $result.lhm_loaded) { throw 'EXE self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: HardwareMonitorUI-windows-x64
          path: dist/HardwareMonitorUI-windows-x64.zip
